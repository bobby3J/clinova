; Scoped to this project's docroot only (doesn't touch the machine-wide
; php.ini) — the default upload_max_filesize (2M) is too small for sound
; files uploaded via the admin console's Sound Library page.
upload_max_filesize = 20M
post_max_size = 25M
; A multimodal AI Practice generation (Slides -> Gemini) genuinely takes
; longer than the 30s default — see Dockerfile's matching setting for the
; full story. .user.ini only applies under php-fpm/cgi SAPIs, not CLI's
; `php artisan serve` (which doesn't honor -d or PHP_INI_SCAN_DIR for its
; spawned subprocess either — confirmed the hard way) — call
; set_time_limit(120) at the top of a one-off script instead, if testing
; this specifically from the CLI.
max_execution_time = 120
